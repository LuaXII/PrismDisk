[package]
name = "prismdisk-setup"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "PrismDisk Setup"

[[bin]]
name = "PrismDisk-Setup"
path = "src/main.rs"

[build-dependencies]
flate2 = "1"
embed-resource = "3"

[dependencies]
eframe = "=0.31.1"
egui_extras = { version = "=0.31.1", features = ["svg"] }
rfd = "0.15"
raw-window-handle = "0.6"
flate2 = "1"
winreg = "0.55"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_Graphics_Dwm",
] }
